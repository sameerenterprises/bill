<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wholesale & Retail Price List</title>

<style>
body{
  font-family:Arial,sans-serif;
  margin:20px;
  background:#f8f9fa;
}

h2{
  text-align:center;
  margin-bottom:15px;
}

.search-box{
  display:flex;
  justify-content:center;
  margin-bottom:15px;
}

.search-box input{
  width:300px;
  padding:8px;
  font-size:16px;
  border:1px solid #ccc;
  border-radius:6px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}

th,td{
  padding:10px;
  text-align:center;
  border:1px solid #ccc;
}

th.product-header{
  background:#007bff;
  color:#fff;
}

th.wholesale{
  background:#198754;
  color:#fff;
}

th.retail{
  background:#dc3545;
  color:#fff;
}

th.wholesale-sub{
  background:#d1e7dd;
  color:#14532d;
}

th.retail-sub{
  background:#f8d7da;
  color:#842029;
}

td.wholesale{
  background:#f0faf5;
}

td.retail{
  background:#fff5f5;
}

tr:hover td{
  background:#f1f1f1;
}

.no-results{
  text-align:center;
  margin-top:15px;
  font-style:italic;
  color:gray;
}

@media(max-width:700px){
  body{
    margin:8px;
  }

  table{
    font-size:13px;
  }

  th,td{
    padding:7px 4px;
  }

  .search-box input{
    width:100%;
  }
}
</style>

</head>

<body>

<h2>Wholesale & Retail Price List</h2>

<div class="search-box">
<input type="text" id="searchInput" placeholder="Search for products...">
</div>

<table id="productTable">

<thead>

<tr>
  <th class="product-header" rowspan="2">Product Name</th>
  <th class="product-header" rowspan="2">Quantity</th>
  <th class="wholesale" colspan="2">Wholesale</th>
  <th class="retail" colspan="2">Retail</th>
</tr>

<tr>
  <th class="wholesale-sub">Cash</th>
  <th class="wholesale-sub">GST</th>
  <th class="retail-sub">Cash</th>
  <th class="retail-sub">GST</th>
</tr>

</thead>

<tbody id="tableBody">
</tbody>

</table>

<p id="noResults" class="no-results" style="display:none;">
No products found
</p>

<script>

// 📦 Product dictionary
//
// Format:
// ["Product Name","Quantity",WholesaleCash,WholesaleGST,RetailCash,RetailGST]

const products = [

  ["Gypblock Board 6'x4'x12.5mm","1 Nos",330,360,400,450],

  ["Gyproc Board 6'x4'x12.5mm","1 Nos",430,465,500,540],

  ["Xpert Gypsum Plaster","20 Kg",240,252,280,294],

  ["Xpert Gypsum Plaster","25 Kg",290,304.5,330,346.5]

];


const tableBody =
  document.getElementById("tableBody");

const searchInput =
  document.getElementById("searchInput");

const noResults =
  document.getElementById("noResults");


function renderTable(filteredProducts){

  tableBody.innerHTML="";

  if(filteredProducts.length===0){

    noResults.style.display="block";

    return;

  }

  noResults.style.display="none";

  filteredProducts.forEach(p=>{

    const row=`

      <tr>

        <td>${p[0]}</td>

        <td>${p[1]}</td>

        <td class="wholesale">${p[2]}</td>

        <td class="wholesale">${p[3]}</td>

        <td class="retail">${p[4]}</td>

        <td class="retail">${p[5]}</td>

      </tr>

    `;

    tableBody.innerHTML+=row;

  });

}


// Initial render
renderTable(products);


// Search
searchInput.addEventListener("input",function(){

  const query=this.value.toLowerCase();

  const filtered=products.filter(p=>
    p[0].toLowerCase().includes(query)
  );

  renderTable(filtered);

});

</script>

</body>
</html>
